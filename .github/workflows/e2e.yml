name: E2E tests

on:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # match deploy.yml
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        # No --with-deps: GitHub-hosted Ubuntu runners already ship the
        # required browser libraries, and --with-deps runs apt-get, which
        # can fail when the runner has DNS problems with Ubuntu mirrors.
        run: npx playwright install chromium

      - name: Run e2e tests
        run: npx playwright test
        env:
          # Placeholders: src/lib/env.ts throws on missing vars and the auth
          # module reads these at boot, so the dev server won't start without
          # them. Only the email/password login is exercised — no Google
          # sign-in under test, so no real credentials are needed (and none
          # would ever reach a worker process anyway).
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
